name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version tag'
        required: false
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install

      - name: Build static theme
        run: npm run build-static

      - name: Build auto-updating theme
        run: npm run build-auto

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.event.inputs.version || format('release-{0}', github.run_id) }}
          name: Release ${{ github.event.inputs.version || format('release-{0}', github.run_id) }}
          body: 'Automated release with built theme files.'
          files: |
            dist/Fluent-Discord-static.theme.css
            dist/Fluent-Discord.theme.css
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
